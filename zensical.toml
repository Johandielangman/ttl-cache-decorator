[project]
site_url = "https://johandielangman.github.io/ttl-cache-decorator/"
site_name = "ttl-cache-decorator"
site_description = "LRU Cache Decorator with a Time to Live"
site_author = "Johandielangman"

copyright = "Copyright &copy; 2026 Johandielangman"

repo_url = "https://github.com/Johandielangman/ttl-cache-decorator"
repo_name = "ttl-cache-decorator"
# edit_uri = "edit/main/docs/"
site_dir = "site"
dev_addr = "localhost:42069"
watch = ["src/"]

nav = [{ "Get started" = "index.md" }]

extra_css = ["docs/static/stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
name = "catppuccin"
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
# custom_dir = "docs/static/html"
language = "en"
features = [
    "announce.dismiss",
    # "content.action.edit",
    # "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    # "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    "navigation.sections",
    # "navigation.tabs",
    # "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    # "toc.follow",
    # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "catppuccin-latte"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "catppuccin-macchiato"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.extra.version]
provider = "mike"

# ref: https://zensical.org/docs/setup/extensions/mkdocstrings/
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
    "https://docs.python.org/3/objects.inv",
] # lets signatures link to stdlib types

[project.plugins.mkdocstrings.handlers.python.options]
# extensions = ["griffe_typingdoc"]  # uncomment if you use typing_extensions.Doc
docstring_style = "google"
docstring_section_style = "table"
show_source = true
show_root_heading = true
show_root_full_path = false
show_object_full_path = false
show_category_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
show_if_no_docstring = true
inherited_members = true
members_order = "source"
separate_signature = true
signature_crossrefs = true
unwrap_annotated = true
merge_init_into_class = true
filters = ["!^_"]
