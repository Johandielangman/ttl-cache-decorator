name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A personal access token is required so the pushed tag triggers the
      # test/docs/publish workflows — pushes made with the default
      # GITHUB_TOKEN never start new workflow runs.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Bump version
        run: uv version --bump ${{ inputs.bump }}
      - name: Generate changelog
        run: git-cliff --config cliff.toml --tag "v$(uv version --short)" --output CHANGELOG.md
      - name: Commit, tag and push
        run: |
          VERSION=$(uv version --short)
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin main
          git push origin "v$VERSION"
