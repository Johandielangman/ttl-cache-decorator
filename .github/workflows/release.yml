name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          patch/minor/major = stable release ·
          *-rc = start a release candidate (0.1.3 → 0.2.0rc1) ·
          rc = next candidate (0.2.0rc1 → 0.2.0rc2) ·
          stable = promote candidate (0.2.0rc2 → 0.2.0)
        type: choice
        options: [patch, minor, major, patch-rc, minor-rc, major-rc, rc, stable]
        default: patch

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# No FORCE_COLOR here: uv honours it even when piped, so $(uv version --short)
# would capture ANSI escape codes into the version string.
env:
  NO_COLOR: "1"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      bump-args: ${{ steps.version.outputs.bump-args }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be started from main (got ${GITHUB_REF})"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            *-rc) args="--bump ${BUMP%-rc} --bump rc" ;;
            *)    args="--bump $BUMP" ;;
          esac
          current=$(uv version --short --color never)
          # uv rejects invalid transitions itself (e.g. "rc" or "stable" from a stable version).
          version=$(uv version --short --color never --dry-run --no-sync $args)

          # Guard against anything but a plain X.Y.Z[{a,b,rc}N] leaking into tags, URLs and job names.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Unexpected version string: $(printf '%q' "$version")"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          prerelease=false
          [[ "$version" =~ (a|b|rc)[0-9]+$ ]] && prerelease=true

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "bump-args=$args"
          } >> "$GITHUB_OUTPUT"
          echo "### Releasing \`v$version\` (from \`$current\`, pre-release: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  tag:
    name: Tag v${{ needs.prepare.outputs.version }}
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUMP_ARGS: ${{ needs.prepare.outputs.bump-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] -- this job pushes the release commit + tag
        with:
          # Release exactly the commit CI tested. If main moved meanwhile, the push fails.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Bump version
        run: |
          uv version --no-sync $BUMP_ARGS
          test "$(uv version --short --color never)" = "$VERSION"
      - name: Generate changelog and release notes
        run: |
          uv run --frozen --only-group release git-cliff --tag "v$VERSION" --output CHANGELOG.md
          uv run --frozen --only-group release git-cliff --tag "v$VERSION" --unreleased --strip all --output RELEASE_NOTES.md
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  build:
    name: Build
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Verify built version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls dist/
          ls dist/*-"$VERSION"-py3-none-any.whl dist/*-"$VERSION".tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ttl-cache-decorator/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write # trusted publishing + attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
      - name: Create release
        run: |
          if [ "$PRERELEASE" = "true" ]; then flag=--prerelease; else flag=--latest; fi
          gh release create "$TAG" artifacts/dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file artifacts/release-notes/RELEASE_NOTES.md \
            $flag

  docs:
    name: Docs
    needs: [prepare, publish-pypi]
    # Pre-releases don't get versioned docs; "dev" already tracks main.
    if: needs.prepare.outputs.prerelease == 'false'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.prepare.outputs.version }}
