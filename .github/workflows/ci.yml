name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml so a release is gated on the exact same checks.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

permissions: {}

concurrency:
  # github.workflow resolves to the *caller* when invoked via workflow_call,
  # so this never collides with the release workflow's own group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1" # fail if uv.lock is out of date with pyproject.toml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --no-default-groups --group lint
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --no-default-groups --group test
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml --junitxml=junit.xml

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ runner.os }},py${{ matrix.python-version }}
          name: ${{ runner.os }}-py${{ matrix.python-version }}
          # Fork PRs upload tokenless and may be rejected; everything else must upload.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          flags: ${{ runner.os }},py${{ matrix.python-version }}

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Run tests against the built wheel
        # --no-project: test the wheel as a user would install it, not the source tree.
        run: uv run --isolated --no-project --with dist/*.whl --with pytest --with dirty-equals pytest -p no:cacheprovider

  # Single required status check for branch protection.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
