# git-cliff ~ changelog configuration
# https://git-cliff.org/docs/configuration
#
# Only stable tags (vX.Y.Z) count as releases. Release-candidate tags are ignored,
# so a stable release lists everything since the previous stable release, and an
# RC's notes list everything it would ship.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

"""
body = """
{%- set repo = "https://github.com/Johandielangman/ttl-cache-decorator" -%}
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
          {% if commit.breaking %}[**breaking**] {% endif %}\
          {{ commit.message | upper_first }} \
          ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# HTML comments only control group order; they're stripped from the output.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = '^chore\(release\)|^chore: release', skip = true },
    { message = "^(build|ci)", group = "<!-- 6 -->Build & CI" },
    { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"
